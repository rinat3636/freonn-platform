<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
    <meta name="theme-color" content="#ED1C24" />
    <meta name="description" content="Freonn Platform — управление строительными объектами" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Freonn Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="error-display" style="color:red;white-space:pre-wrap;font-family:monospace;padding:1rem"></div>
    <script>
      window.onerror = function(msg, src, line, col, err) {
        document.getElementById('error-display').textContent += msg + ' at ' + src + ':' + line + '\n' + (err && err.stack ? err.stack : '') + '\n';
      };
      window.addEventListener('error', function(e) {
        document.getElementById('error-display').textContent += e.message + '\n' + (e.error && e.error.stack ? e.error.stack : '') + '\n';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
