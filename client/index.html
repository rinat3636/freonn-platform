    <!-- SSR-фолбэк (#ssr-fallback) нужен роботам и режиму без JS, но в обычном
         браузере он успевает мелькнуть до загрузки React. Прячем его визуально,
         оставляя в DOM; для отключённого JS возвращаем показ через <noscript>. -->
    <style>#ssr-fallback{display:none !important}</style>
    <noscript><style>#ssr-fallback{display:block !important}</style></noscript>
